include:
  - project: "mpdev/ci-cd-templates"
    ref: "main"
    file:
      - "_default.yml"
      - "/jobs/collect-state.yml"
  - component: $CI_SERVER_FQDN/components/code-quality/license-scanner/license-scanner@~latest
    inputs:
      stage: "application:code-quality"
      job_name: "license scan"
      application_name: ${APPLICATION}
      work_dir: "${CI_PROJECT_DIR}"
      gitlab_token: ${GITLAB_COMPONENT_JOB}
      extends:
        - .common_cache
        - .common_before
        - .rules:default-branch-or-mr
      needs:
        - job: collect state
          artifacts: true

stages:
  - state:notification
  - application:code-quality
  - application:artifact

variables:
  CI_CD_TEMPLATE_REF_NAME: "main"
  APPLICATION: "metarank"
  WORK_DIR: ${CI_PROJECT_DIR}
  GAR_REGISTRY: "europe-docker.pkg.dev"
  GAR_PROJECT: "metro-markets-cps-artifacts"
  GAR_REPOSITORY: "docker-base"
  GAR_IMAGE_PATH: "mpdev/rnd/metarank/metarank"
  DOCKER_HOST: "tcp://docker:2375"
  IMAGE_TAG: "0.7.11-custom"

values.yaml lint:
  rules:
    - when: never

artifact:
  stage: application:artifact
  image: ${CI_IMAGE__DOCKER}
  services:
    - name: ${CI_IMAGE__DOCKER_IN_DOCKER}
      alias: docker
      command: [ "--experimental" ]
  variables:
    GIT_DEPTH: 0
  extends:
    - .common_before
    - .rules:default-branch
  script:
    - |
      set -euo pipefail

      # Resolve GAR image coordinates (allow override of repository)
      GAR_REPO="${GAR_REPOSITORY}"
      if [[ -n "${GAR_REPOSITORY_OVERRIDE:-}" ]]; then
        GAR_REPO="${GAR_REPOSITORY_OVERRIDE}"
      fi
      GAR_IMAGE_BASE="${GAR_REGISTRY}/${GAR_PROJECT}/${GAR_REPO}/${GAR_IMAGE_PATH}"
      GAR_IMAGE="${GAR_IMAGE_BASE}:${IMAGE_TAG}"
      echo "GAR_IMAGE=${GAR_IMAGE}"

      # Ensure we can reach docker:dind from the job container
      echo "Docker client:"
      docker version || { echo "ERROR: docker client not available"; exit 1; }
      echo "Testing connection to docker daemon at $DOCKER_HOST ..."
      if ! docker version >/dev/null 2>&1; then
        echo "ERROR: Cannot connect to docker daemon at $DOCKER_HOST"; exit 1;
      fi

      # Install JDK + sbt (sbt-extras) in the job container
      echo "Installing JDK and sbt in job container..."
      if command -v apt-get >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates git bash openjdk-21-jdk
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache curl ca-certificates git bash openjdk21
      elif command -v yum >/dev/null 2>&1; then
        yum install -y curl ca-certificates git bash java-21-openjdk
      else
        echo "ERROR: Unknown base image package manager; cannot install JDK." >&2
        exit 1
      fi
      curl -fsSL https://raw.githubusercontent.com/paulp/sbt-extras/master/sbt -o /usr/local/bin/sbt
      chmod +x /usr/local/bin/sbt
      sbt --version

      # Speed up Coursier/Ivy caches across runs (optional)
      export COURSIER_CACHE="${CI_PROJECT_DIR}/.cache/coursier"
      export SBT_OPTS="${SBT_OPTS:-} -Dsbt.coursier.home=${COURSIER_CACHE}"

      # Align version tag and build fat jar
      sbt "set ThisBuild/version := \"${IMAGE_TAG}\"" +clean +assembly

      # Build Docker image via sbt native packager (uses docker client available in this job container)
      sbt docker

      # Double-check image exists locally and tag matches
      docker images | grep -E "${GAR_PROJECT}.+${IMAGE_TAG}" || true

      # Push to GAR
      docker push "${GAR_IMAGE}"

  needs:
    - job: collect state
      artifacts: true